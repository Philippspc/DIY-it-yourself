<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIY it yourself | Global Maker Network</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <div class="logo" onclick="showSection('gateway')">DIY it yourself</div>
        <div class="nav-links">
            <a href="#" onclick="showSection('gateway')">Search</a>
            <a href="#" onclick="showSection('supporters')">Supporters</a>
            <a href="#" onclick="showSection('legal')">Legal</a>
            <button id="login-btn" onclick="handleProfileClick()">Login</button>
        </div>
    </nav>

    <div id="login-modal" class="modal" style="display:none;">
        <div class="card">
            <h2>Maker Login</h2>
            <input type="text" id="username-input" placeholder="Username">
            <input type="password" id="password-input" placeholder="Password">
            <button onclick="performLogin()">Sign In / Register</button>
            <button onclick="toggleLogin()" class="cancel">Cancel</button>
        </div>
    </div>

    <div id="gateway" class="page-section">
        <div class="card">
            <h1>DIY it yourself</h1>
            <p>Stop scrolling. Start building.</p>
            <input type="text" id="search-input" placeholder="Search projects..." onkeypress="if(event.key === 'Enter') handleSearch()">
            <div class="button-group">
                <button onclick="handleSearch()">Find Solutions</button>
                <button class="secondary-btn" onclick="uploadPost()">+ Share Project</button>
            </div>
        </div>
    </div>

    <div id="app-content" class="page-section" style="display: none;">
        <div id="results-container"></div>
    </div>

    <div id="profile" class="page-section" style="display: none;">
        <div class="card wide">
            <div class="profile-header">
                <div class="pfp-container">
                    <div id="pfp-display" class="pfp-circle">🛠️</div>
                    <div class="edit-icon" onclick="openPfpDialog()">✏️</div>
                </div>
                <div class="profile-text">
                    <h2 id="profile-name-display">Maker Name</h2>
                    <p id="profile-bio-display">Your bio here.</p>
                </div>
            </div>
            <hr>
            <input type="text" id="edit-bio" placeholder="New bio...">
            <button onclick="saveProfile()">Save Profile</button>
            <button onclick="logout()" class="cancel">Logout</button>
        </div>
    </div>

    <div id="supporters" class="page-section" style="display: none;">
        <div class="card wide">
            <h1>Supporters</h1>
            <p>🌟 Max Mustermann, 🛠️ Anna Schmidt</p>
        </div>
    </div>

    <div id="legal" class="page-section" style="display: none;">
        <div class="card wide">
            <h1>Legal</h1>
            <p>Contact: admin@diy-it-yourself.com</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
